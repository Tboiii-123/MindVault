x-app: &app
  build:
    context: .
    target: dev
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgres://ainotes:ainotes@db:5432/ainotes
    REDIS_URL: redis://redis:6379/0
    # Dev: audio is saved to ./media on your computer (shared by web + worker through the
    # volume below). No MinIO / S3 needed. To use S3-compatible storage, see README.
    USE_S3: "0"
  volumes:
    - .:/app
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ainotes
      POSTGRES_PASSWORD: ainotes
      POSTGRES_DB: ainotes
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ainotes"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    ports: ["8000:8000"]

  worker:  # Celery worker: speech-to-text + LLM jobs
    <<: *app
    command: celery -A config worker -l info -Q default,ai --concurrency=2
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  beat:  # periodic jobs (stuck-entry sweeper)
    <<: *app
    command: celery -A config beat -l info

volumes:
  pgdata:
  redisdata: